<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176fc"/>
      <stop offset="100%" stop-color="#e0c3fc"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1f2d47" stroke-width="6"/>

  <!-- Soundwave ambient rings -->
  <path d="M 120 220 A 140 140 0 0 0 120 292" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 85 190 A 190 190 0 0 0 85 322" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

  <path d="M 392 220 A 140 140 0 0 1 392 292" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 427 190 A 190 190 0 0 1 427 322" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

  <!-- Equalizer / DSP pulses in background -->
  <rect x="180" y="320" width="10" height="24" rx="5" fill="#4facfe" opacity="0.5"/>
  <rect x="200" y="300" width="10" height="44" rx="5" fill="#00f2fe" opacity="0.7"/>
  <rect x="220" y="280" width="10" height="64" rx="5" fill="#00f2fe" opacity="0.9"/>
  <rect x="282" y="280" width="10" height="64" rx="5" fill="#00f2fe" opacity="0.9"/>
  <rect x="302" y="300" width="10" height="44" rx="5" fill="#00f2fe" opacity="0.7"/>
  <rect x="322" y="320" width="10" height="24" rx="5" fill="#4facfe" opacity="0.5"/>

  <!-- Microphone Capsule Core -->
  <g filter="url(#neonGlow)">
    <!-- Mic Body -->
    <rect x="216" y="110" width="80" height="150" rx="40" fill="url(#cyanGrad)"/>
    <rect x="226" y="120" width="60" height="70" rx="30" fill="#0c1626" opacity="0.4"/>

    <!-- Mesh Grille Lines -->
    <line x1="226" y1="140" x2="286" y2="140" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>
    <line x1="226" y1="155" x2="286" y2="155" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>
    <line x1="226" y1="170" x2="286" y2="170" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>

    <!-- Mic Stand / Cradle -->
    <path d="M 186 210 C 186 300 326 300 326 210" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="295" x2="256" y2="370" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="196" y1="370" x2="316" y2="370" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Cybernetic MVX branding accent -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#00f2fe" text-anchor="middle" letter-spacing="4">MODULAR VOICE</text>
</svg>

